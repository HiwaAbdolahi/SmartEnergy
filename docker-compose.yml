services:
  mosquitto:
    build:
      context: ./mosquittoC     # <- bruk riktig mappe
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"

  dashboard:
    build:
      context: ./dashboardC     # <- bruk riktig mappe
    container_name: smartenergy-dashboard
    ports:
      - "8080:80"
    depends_on:
      - mosquitto

  smartenergy:
    build:
      context: ./workerC        # <- bygg fra workerC
      dockerfile: Dockerfile    # (kan utelates; standardnavn)
    container_name: smartenergy
    depends_on:
      - mosquitto
