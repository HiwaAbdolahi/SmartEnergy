name: build-push-deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Nødvendig for OIDC + å lese repo
permissions:
  id-token: write
  contents: read

env:
  # ACR/ressurser (samme verdier som du allerede har lagret som repo-secrets)
  ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}                 # smartenergyhiwa
  ACR_SERVER: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}       # smartenergyhiwa.azurecr.io
  RG: ${{ secrets.AZURE_RESOURCE_GROUP }}                 # rg-smartenergy-dev

  # Azure Container Apps (app-navn + container-navn inne i hver app)
  DASH_APP: smartenergy-dev
  WORKER_APP: smartenergy-worker
  MQTT_APP: smartenergy-mqtt

  DASH_CONTAINER: smartenergy-dev
  WORKER_CONTAINER: smartenergy-worker
  MQTT_CONTAINER: smartenergy-mqtt

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - svc: mosquitto
            context: ./mosquittoC
            dockerfile: Dockerfile
            image: mosquitto
          - svc: dashboard
            context: ./dashboardC
            dockerfile: Dockerfile
            image: smartenergy-dashboard
          - svc: worker
            context: ./workerC
            dockerfile: Dockerfile
            image: smartenergy-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR (uses Azure session)
        run: az acr login -n "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push ${{ matrix.svc }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.ACR_SERVER }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.ACR_SERVER }}/${{ matrix.image }}:latest

  deploy-smartenergy:
    runs-on: ubuntu-latest
    needs: build-push
    concurrency:
      group: smartenergy-deploy
      cancel-in-progress: true

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Oppdater hver app til bilde med samme commit-SHA
      - name: Deploy dashboard
        run: |
          az containerapp update -g "$RG" -n "$DASH_APP" \
            --image "$ACR_SERVER/smartenergy-dashboard:${GITHUB_SHA}" \
            --container-name "$DASH_CONTAINER"

      - name: Deploy worker
        run: |
          az containerapp update -g "$RG" -n "$WORKER_APP" \
            --image "$ACR_SERVER/smartenergy-worker:${GITHUB_SHA}" \
            --container-name "$WORKER_CONTAINER"

      - name: Deploy mosquitto
        run: |
          az containerapp update -g "$RG" -n "$MQTT_APP" \
            --image "$ACR_SERVER/mosquitto:${GITHUB_SHA}" \
            --container-name "$MQTT_CONTAINER"

      - name: Show revisions (alle tre)
        run: |
          az containerapp revision list -g "$RG" -n "$DASH_APP"  -o table
          az containerapp revision list -g "$RG" -n "$WORKER_APP" -o table
          az containerapp revision list -g "$RG" -n "$MQTT_APP"  -o table
