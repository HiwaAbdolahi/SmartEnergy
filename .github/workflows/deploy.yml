name: build-push-deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}                 # smartenergyhiwa
  ACR_SERVER: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}       # smartenergyhiwa.azurecr.io
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}     # rg-smartenergy-dev
  CONTAINERAPP_NAME: ${{ secrets.AZURE_CONTAINERAPP_NAME }} # smartenergy-dev
  CONTAINER_NAME: smartenergy-dev
  # Hvilket image som skal deployes til dashboard-appen:
  DEPLOY_IMAGE_NAME: smartenergy-dashboard

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - svc: mosquitto
            context: ./mosquittoC
            dockerfile: Dockerfile
            image: mosquitto
          - svc: dashboard
            context: ./dashboardC
            dockerfile: Dockerfile
            image: smartenergy-dashboard
          - svc: worker
            context: ./workerC
            dockerfile: Dockerfile
            image: smartenergy-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR (uses Azure session)
        run: az acr login -n "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push ${{ matrix.svc }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          no-cache: true                # <- Tving nytt build, tar med index.html
          tags: |
            ${{ env.ACR_SERVER }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.ACR_SERVER }}/${{ matrix.image }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    concurrency:
      group: smartenergy-deploy
      cancel-in-progress: true
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy chosen image to Container App
        run: |
          IMAGE_REF="${ACR_SERVER}/${DEPLOY_IMAGE_NAME}:${GITHUB_SHA}"
          echo "Deploying $IMAGE_REF to ${CONTAINERAPP_NAME}/${CONTAINER_NAME}"
          az containerapp update \
            -n "${CONTAINERAPP_NAME}" \
            -g "${RESOURCE_GROUP}" \
            --image "$IMAGE_REF" \
            --container-name "${CONTAINER_NAME}"

      - name: Ensure min replicas = 1 (so a replica exists)
        run: |
          az containerapp update -g "${RESOURCE_GROUP}" -n "${CONTAINERAPP_NAME}" --min-replicas 1
          az containerapp revision list -g "${RESOURCE_GROUP}" -n "${CONTAINERAPP_NAME}" -o table
