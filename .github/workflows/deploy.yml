name: build-push-deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# NØDVENDIG for OIDC
permissions:
  id-token: write
  contents: read

env:
  # Secrets må være satt i repoet ditt (du har dem fra før)
  ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}                 # smartenergyhiwa
  ACR_SERVER: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}       # smartenergyhiwa.azurecr.io
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}     # rg-smartenergy-dev

  # App-navn i ACA
  DASH_APP: smartenergy-dev
  WORKER_APP: smartenergy-worker
  MQTT_APP: smartenergy-mqtt

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - svc: mosquitto
            context: ./mosquittoC
            dockerfile: Dockerfile
            image: mosquitto
          - svc: dashboard
            context: ./dashboardC
            dockerfile: Dockerfile
            image: smartenergy-dashboard
          - svc: worker
            context: ./workerC
            dockerfile: Dockerfile
            image: smartenergy-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR (uses Azure session)
        run: az acr login -n "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push ${{ matrix.svc }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.ACR_SERVER }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.ACR_SERVER }}/${{ matrix.image }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    concurrency:
      group: smartenergy-deploy
      cancel-in-progress: true
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy dashboard image
        run: |
          az containerapp update -g "${RESOURCE_GROUP}" -n "${{ env.DASH_APP }}" \
            --container-name smartenergy-dev \
            --image "${{ env.ACR_SERVER }}/smartenergy-dashboard:${GITHUB_SHA}"

      - name: Deploy worker image
        run: |
          az containerapp update -g "${RESOURCE_GROUP}" -n "${{ env.WORKER_APP }}" \
            --container-name smartenergy-worker \
            --image "${{ env.ACR_SERVER }}/smartenergy-worker:${GITHUB_SHA}"

      - name: Deploy mqtt image
        run: |
          az containerapp update -g "${RESOURCE_GROUP}" -n "${{ env.MQTT_APP }}" \
            --container-name smartenergy-mqtt \
            --image "${{ env.ACR_SERVER }}/mosquitto:${GITHUB_SHA}"

      - name: Show revisions
        run: |
          echo "Dashboard:"
          az containerapp revision list -g "${RESOURCE_GROUP}" -n "${{ env.DASH_APP }}" -o table
          echo "Worker:"
          az containerapp revision list -g "${RESOURCE_GROUP}" -n "${{ env.WORKER_APP }}" -o table
          echo "MQTT:"
          az containerapp revision list -g "${RESOURCE_GROUP}" -n "${{ env.MQTT_APP }}" -o table
