name: build-push-deploy

on:
  push:
    branches: [ "master" ]

env:
  RG: rg-smartenergy-dev
  ACR_NAME: smartenergyhiwa
  ACR_LOGIN_SERVER: smartenergyhiwa.azurecr.io
  APP_DASH: smartenergy-dev
  APP_WORKER: smartenergy-worker
  APP_MQTT: smartenergy-mqtt
  MQTT_WSS: wss://smartenergy-mqtt.calmmushroom-56122533.norwayeast.azurecontainerapps.io/

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: smartenergy-dashboard
            context: ./dashboardC
            dockerfile: ./dashboardC/Dockerfile
          - name: smartenergy-worker
            context: ./workerC
            dockerfile: ./workerC/Dockerfile
          - name: mosquitto
            context: ./mosquittoC
            dockerfile: ./mosquittoC/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (SP)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Docker login to ACR (with SP)
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          password: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.name }}:${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (SP)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container Apps
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -e
            SHA=${{ github.sha }}
            ACR=${{ env.ACR_LOGIN_SERVER }}
            RG=${{ env.RG }}

            az containerapp update -g "$RG" -n "${{ env.APP_DASH }}" \
              --image "$ACR/smartenergy-dashboard:$SHA" \
              --min-replicas 1 \
              --set-env-vars DASH_BUILD_SHA="$SHA"

            az containerapp update -g "$RG" -n "${{ env.APP_WORKER }}" \
              --image "$ACR/smartenergy-worker:$SHA" \
              --min-replicas 1 \
              --set-env-vars MQTT_WS_URL="${{ env.MQTT_WSS }}" WORKER_BUILD_SHA="$SHA"

            az containerapp update -g "$RG" -n "${{ env.APP_MQTT }}" \
              --image "$ACR/mosquitto:$SHA" \
              --min-replicas 1

            for APP in "${{ env.APP_DASH }}" "${{ env.APP_WORKER }}" "${{ env.APP_MQTT }}"; do
              echo "$APP image =>"
              az containerapp show -g "$RG" -n "$APP" --query "properties.template.containers[0].image" -o tsv
            done
