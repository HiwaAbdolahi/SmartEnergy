name: build-push-deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  # Fra GitHub Secrets (du har satt disse)
  ACR_LOGIN_SERVER: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}   # ex: smartenergyhiwa.azurecr.io
  ACR_NAME:         ${{ secrets.AZURE_ACR_NAME }}           # smartenergyhiwa
  RG:               ${{ secrets.AZURE_RESOURCE_GROUP }}     # rg-smartenergy-dev
  APP:              ${{ secrets.AZURE_CONTAINERAPP_NAME }}  # smartenergy-dev

  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # <- mappene dine fra docker-compose.yml
          - image: smartenergy
            ctx: ./workerC
            df:  ./workerC/Dockerfile
          - image: dashboard
            ctx: ./dashboardC
            df:  ./dashboardC/Dockerfile
          - image: mosquitto
            ctx: ./mosquittoC
            df:  ./mosquittoC/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Logg inn i ACR
        run: az acr login -n "$ACR_NAME"

      - name: Bygg ${{ matrix.image }}
        run: |
          docker build \
            -f "${{ matrix.df }}" \
            -t "$ACR_LOGIN_SERVER/${{ matrix.image }}:$IMAGE_TAG" \
            "${{ matrix.ctx }}"

      - name: Push ${{ matrix.image }}
        run: docker push "$ACR_LOGIN_SERVER/${{ matrix.image }}:$IMAGE_TAG"

  deploy-smartenergy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Oppdater Container App (bruk smartenergy-bildet)
        run: |
          az containerapp update \
            -n "$APP" -g "$RG" \
            --image "$ACR_LOGIN_SERVER/smartenergy:$IMAGE_TAG" \
            --container-name "$APP"

      - name: Vis revisjon
        run: az containerapp revision list -n "$APP" -g "$RG" -o table
