# NGINX proxy for MQTT over WebSocket via ACA frontdoor (TLS)
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # WS-proxy: /mqtt -> mosquitto (external FQDN)
  location /mqtt {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # VIKTIG: Host må være appens FQDN, ellers rutes ikke trafikken i ACA
    proxy_set_header Host smartenergy-mqtt.calmmushroom-56122533.norwayeast.azurecontainerapps.io;

    proxy_read_timeout 300s;
    proxy_pass https://smartenergy-mqtt.calmmushroom-56122533.norwayeast.azurecontainerapps.io/;
  }
}
