resolver 1.1.1.1 8.8.8.8 ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy fra /mqtt (frontenden) -> MQTT-appen (wss via Azure ingress)
  location /mqtt {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # HELT AVGJØRENDE: Host må være FQDN til MQTT-appen,
    # ellers rutes det til feil app i Container Apps ingress.
    proxy_set_header Host smartenergy-mqtt.calmmushroom-56122533.norwayeast.azurecontainerapps.io;

    proxy_read_timeout 3600;
    proxy_send_timeout 3600;

    # Bruk SNI når vi proxy'er til https
    proxy_ssl_server_name on;

    # Bruk https (Azure terminere TLS på 443 og videresender til targetPort 9001)
    proxy_pass https://smartenergy-mqtt.calmmushroom-56122533.norwayeast.azurecontainerapps.io/;
  }
}
